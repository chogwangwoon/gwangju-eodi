name: 일정 자동 업데이트

on:
  workflow_dispatch:
  schedule:
    # 한국시간 09:10 / 18:10
    - cron: "10 0,9 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TourAPI + KOPIS 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: python scripts/update_data.py

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "gwangju-eodi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "자동 일정 업데이트"
            git push
          fi
